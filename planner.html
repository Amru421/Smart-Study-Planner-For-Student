<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Planner</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <header>

        <div class="logo">📚 StudyPlanner</div>

        <nav>

            <a href="index.html">Home</a>

            <a href="subjects.html">Subjects</a>

            <a href="planner.html" class="active">
                Planner
            </a>

            <a href="timetable.html">
                Timetable
            </a>

            <a href="progress.html">
                Progress
            </a>

            <button type="button" id="darkModeToggle" aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode" onclick="toggleDarkMode()">
                🌙
            </button>

        </nav>

    </header>


    <main class="page">

        <h1>📝 Daily Study Planner</h1>

        <p class="subtitle">
            Add your study tasks and track completion.
        </p>


        <form class="form-card" onsubmit="event.preventDefault(); addTask()">

            <label for="taskInput" class="visually-hidden">Study task</label>
            <input type="text" id="taskInput" placeholder="Enter study task" maxlength="160" required>


            <label for="priority" class="visually-hidden">Task priority</label>
            <select id="priority">

                <option value="Low">
                    Low Priority
                </option>

                <option value="Medium">
                    Medium Priority
                </option>

                <option value="High">
                    High Priority
                </option>

            </select>


            <button type="submit" class="btn">

                + Add Task

            </button>

        </form>


        <div class="task-section">

            <h2>Today's Tasks</h2>

            <div class="task-filters">
                <label for="taskStatusFilter">Status</label>
                <select id="taskStatusFilter" onchange="loadTasks()">
                    <option value="all">All tasks</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>

                <label for="taskPriorityFilter">Priority</label>
                <select id="taskPriorityFilter" onchange="loadTasks()">
                    <option value="all">All priorities</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            <div id="taskList"></div>

        </div>

    </main>


    <footer>

        <p>
            © 2026 Student Study Planner
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
